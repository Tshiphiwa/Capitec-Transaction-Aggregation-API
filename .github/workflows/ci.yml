name: CI

on: 
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
   - cron: '0 3 * * 1'  

jobs:
  build-and-test:
    name: Build & Test (.NET 8)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    
    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Test with coverage
      run: dotnet test --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./coverage

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        directory: './coverage'
        fail_ci_if_error: false

    - name: Check for vulnerable NuGet packages
      run: dotnet list package --vulnerable --include-transitive 2>&1 | tee vuln.txt && ! grep -q "has the following vulnerable packages" vuln.txt

  docker:
   name: Docker Build
   runs-on: ubuntu-latest
   
   steps:
    - uses: actions/checkout@v4

    - name: Build Docker image
      run: docker build -t capitec-transaction-aggregation-api:ci .

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp

      - name: Build for CodeQL
        run: dotnet build --configuration Release
      
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
